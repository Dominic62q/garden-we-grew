<title>The Garden We Grew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2B1A33">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one full-bleed WebGL garden. Two cartoon figures walk hand in hand along a path; comic speech bubbles float over whoever is talking; one big yellow MOVE button sets them walking again. Committed look: plum ink outlines, paper-white bubbles, sunlit yellow, thread red. */
:root{
  --ink:#2B1A33;
  --paper:#FFFDF6;
  --her:#FFE3EC;
  --sun:#FFD84A;
  --rose:#FF6F8E;
  --text:#FFF7EC;
  --body:'Comic Neue','Comic Sans MS','Chalkboard SE',sans-serif;
  --shout:'Bangers','Impact',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;opacity:0;transition:opacity 2.2s ease}
#stage.on{opacity:1}
#stage canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.prog{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;padding-right:44px}
.prog i{flex:1;height:4px;border-radius:3px;background:rgba(43,26,51,.35);border:1px solid rgba(255,253,246,.55);position:relative;overflow:hidden;box-sizing:border-box}
.prog i::after{content:"";position:absolute;inset:0;background:var(--sun);transform:scaleX(0);transform-origin:left;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.prog i.on::after{transform:scaleX(1)}
#snd{position:absolute;pointer-events:auto;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px));width:44px;height:44px;background:none;border:0;color:var(--paper);filter:drop-shadow(0 1px 3px rgba(43,26,51,.7));display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
#snd:focus-visible,#move:focus-visible,#again:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
#snd .off{display:none}
#snd.muted .on{display:none}
#snd.muted .off{display:block}

/* comic speech bubbles */
.bub{position:absolute;left:0;top:0;box-sizing:border-box;max-width:min(80vw,340px);padding:11px 16px 12px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:26px 30px 24px 28px / 24px 26px 28px 22px;font:700 clamp(17px,4.7vw,21px)/1.2 var(--body);text-align:center;box-shadow:4px 4px 0 var(--ink);transform-origin:var(--tx,50%) 100%;animation:pop .38s cubic-bezier(.3,1.6,.5,1) both;visibility:hidden}
.bub.ready{visibility:visible}
.bub.f{background:var(--her)}
.bub::before{content:"";position:absolute;left:calc(var(--tx,50%) - 15px);bottom:-25px;border-left:15px solid transparent;border-right:15px solid transparent;border-top:26px solid var(--ink)}
.bub::after{content:"";position:absolute;left:calc(var(--tx,50%) - 10px);bottom:-17px;border-left:10px solid transparent;border-right:10px solid transparent;border-top:19px solid var(--paper)}
.bub.f::after{border-top-color:var(--her)}
.bub.dn::before{bottom:auto;top:-25px;border-top:none;border-bottom:26px solid var(--ink)}
.bub.dn::after{bottom:auto;top:-17px;border-top:none;border-bottom:19px solid var(--paper)}
.bub.dn.f::after{border-bottom-color:var(--her)}
.bub.out{animation:unpop .26s ease forwards}
.bub .wd{display:inline-block;opacity:0;transform:translateY(.35em) scale(.85);animation:wd .26s ease forwards;animation-delay:calc(var(--i) * 55ms + 160ms)}
@keyframes pop{from{transform:scale(.4) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
@keyframes unpop{to{transform:scale(.7) translateY(-8px);opacity:0}}
@keyframes wd{to{opacity:1;transform:none}}

/* sound effect lettering */
#sfx{position:absolute;left:0;right:0;top:26%;text-align:center;font:400 clamp(64px,22vw,110px)/1 var(--shout);letter-spacing:.04em;color:var(--rose);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);transform:rotate(-6deg) scale(0);opacity:0}
#sfx.show{animation:sfx 1s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes sfx{0%{transform:rotate(-14deg) scale(0);opacity:0}40%{opacity:1}100%{transform:rotate(-6deg) scale(1);opacity:1}}

/* the MOVE button */
#moveWrap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);display:flex;justify-content:center;pointer-events:none}
#move,#again{pointer-events:auto;display:none;font:400 clamp(30px,8vw,38px)/1 var(--shout);letter-spacing:.09em;color:var(--ink);background:var(--sun);border:4px solid var(--ink);border-radius:18px;padding:12px 38px 9px;box-shadow:6px 6px 0 var(--ink);cursor:pointer;min-height:44px}
#again{background:var(--rose);color:var(--paper);-webkit-text-stroke:0;font-size:clamp(24px,6.5vw,30px);padding:12px 30px 9px}
#move.show,#again.show{display:block;animation:mpop .5s cubic-bezier(.3,1.7,.5,1) both,nudge 1.5s ease-in-out .7s infinite}
#move:active,#again:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink);animation:none}
@keyframes mpop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
@keyframes nudge{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(1.5deg) scale(1.06)}}

.nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:32px;font:700 24px/1.3 var(--body);background:radial-gradient(120% 70% at 50% 100%,#8a3a4a,#2B1A33)}
body.nogl-on .nogl{display:flex}
@media (prefers-reduced-motion:reduce){.bub,.bub .wd{animation:none;opacity:1;transform:none}#move.show,#again.show{animation:none}}
</style>
